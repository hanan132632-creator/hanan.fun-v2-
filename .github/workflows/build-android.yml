name: Build Android App (.aab)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code (must be higher than previous Google Play release, e.g., 2 or 3)'
        required: true
        default: '2'
        type: string
      version_name:
        description: 'Version Name shown to users (e.g., 2.0)'
        required: true
        default: '2.0'
        type: string

jobs:
  build-aab:
    name: Build Signed Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install API 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo "$SDKMANAGER" --licenses > /dev/null || yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | sudo "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" > /dev/null || yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11.1'

      - name: Prepare Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > android-app/app/release.keystore
            echo "Decoded keystore from GitHub Secret ANDROID_KEYSTORE_BASE64."
          elif [ -f "android-app/keystore/android.keystore" ]; then
            cp android-app/keystore/android.keystore android-app/app/release.keystore
            echo "Using keystore from android-app/keystore/android.keystore."
          else
            echo "::error::Missing signing keystore! Add ANDROID_KEYSTORE_BASE64 in Repository Secrets, or (only in a PRIVATE repo) upload android.keystore to android-app/keystore/android.keystore."
            exit 1
          fi

      - name: Build Signed Release AAB
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-app/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease \
            -PappVersionCode=${{ inputs.version_code }} \
            -PappVersionName=${{ inputs.version_name }} \
            --no-daemon

      - name: Upload Signed AAB and R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: gis-android-release-v${{ inputs.version_code }}
          path: |
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
